[project]
name = "diac-tokenizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rana Gaber", email = "ranagaber046@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=1.27.0",
    "sentencepiece>=0.2.2",
    "transformers>=5.15.0",
]

